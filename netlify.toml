[build]
  # SOLO esta carpeta se publica. Antes era "." y la CLI subía TODO lo del Mac, también lo
  # que .gitignore deja fuera: memory/, informes/ y ficheros sueltos se veían en internet
  # (15-oct-2026). Este sitio solo sirve de puente: la app vive en GitHub Pages.
  publish = "netlify/publico"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/anthropic"
  to = "/.netlify/functions/anthropic"
  status = 200

# Puente hacia el PMS: la llave del programa de reservas vive en el servidor, no aquí
[[redirects]]
  from = "/api/pms"
  to = "/.netlify/functions/pms"
  status = 200

# El inventario de plataformas es PRIVADO: la CLI lo sube igualmente, así que se bloquea aquí
[[redirects]]
  from = "/INVENTARIO_PLATAFORMAS.csv"
  to = "/index.html"
  status = 404
  force = true
